<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OCG Engine</title>
    <meta name="description" content="Online card games in the browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%225%22 y=%223%22 width=%2222%22 height=%2226%22 rx=%224%22 fill=%22%23fffdf8%22 stroke=%22%231f6f4a%22 stroke-width=%222%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2214%22 text-anchor=%22middle%22 fill=%22%23b3261e%22%3E%E2%99%A5%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/base.css?rev=1faa7042">
</head>

<body>
    <header class="topbar">
        <h1 id="appTitle">OCG Engine</h1>
        <span id="connection" class="badge">Connecting…</span>
    </header>

    <main>
        <section id="home" aria-labelledby="homeTitle">
            <h2 id="homeTitle">Play</h2>
            <label class="field">Your name
                <input id="playerName" maxlength="24" autocomplete="nickname" placeholder="Player" />
            </label>
            <label class="field" id="gamePicker">Game
                <select id="gameSelect"></select>
            </label>
            <div class="row">
                <button type="button" id="createPublicButton" class="primary">Create public room</button>
                <button type="button" id="createPrivateButton">Create private room</button>
            </div>
            <form id="joinForm" class="row">
                <label class="field grow">Room code
                    <input id="joinCode" inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6" required placeholder="123456" />
                </label>
                <button type="submit">Join</button>
            </form>
            <h3>Public rooms</h3>
            <ul id="publicLobbies" class="list"></ul>
            <p id="noLobbies" class="muted">No public rooms are waiting right now.</p>
        </section>

        <section id="lobby" hidden aria-labelledby="lobbyTitle">
            <h2><span id="lobbyTitle"></span> · Room <span class="room-code"></span></h2>
            <p class="muted"><span id="lobbyVisibility"></span> · <span id="lobbySeats"></span></p>
            <ul id="lobbyPlayers" class="list"></ul>
            <p id="lobbyHint" class="muted" role="status"></p>
            <div class="row">
                <button type="button" id="startButton" class="primary">Start game</button>
                <button type="button" id="addBotButton">Add bot</button>
                <button type="button" id="joinRoomButton" class="primary">Take a seat</button>
                <button type="button" id="copyInviteButton">Copy invite link</button>
                <button type="button" data-leave>Leave</button>
            </div>
        </section>

        <section id="game" hidden aria-labelledby="gameTitle">
            <h2><span id="gameTitle"></span> · Room <span class="room-code"></span></h2>
            <ol id="seats" class="seats"></ol>
            <div class="table" aria-label="Table">
                <p id="tableLabel" class="muted"></p>
                <div id="tableCards" class="cards"></div>
            </div>
            <p id="turnHint" role="status"></p>
            <div id="handSection">
                <div id="hand" class="cards hand" aria-label="Your hand"></div>
                <div id="actions" class="row"></div>
            </div>
            <div id="finishedActions" class="row" hidden>
                <button type="button" id="playAgainButton" class="primary">Back to lobby</button>
                <button type="button" data-leave>Leave</button>
            </div>
            <ul id="gameLog" class="log" aria-label="Game log"></ul>
        </section>
    </main>

    <div id="toast" class="toast" role="alert" hidden></div>

    <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
    <script src="js/config.js?rev=a3d6d172"></script>
    <script src="js/db.js?rev=ed0231c2"></script>
    <script src="js/storage.js?rev=9ca6a52a"></script>
    <script src="js/cards.js?rev=2dc8e98f"></script>
    <script src="js/games.js?rev=62117194"></script>
    <script src="games/climb.js?rev=56cbc9c4"></script>
    <script src="js/room.js?rev=bf8766ae"></script>
    <script src="js/app.js?rev=c2da25ed"></script>
    <script>OCG.app.start();</script>
</body>

</html>
